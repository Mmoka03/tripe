spring.application.name=tripe
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.apiKey=${GEMINI_API_KEY}
spring.ai.google.genai.project-id=${GEMINI_PROJECT_ID}
spring.ai.google.genai.location=${GEMINI_LOCATION}

spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

